[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a running GenLayer network",
  "bradbury: requires funded Bradbury test accounts",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["F403", "F405"]
